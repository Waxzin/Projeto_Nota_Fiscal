<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Cliente</h1>
    <p>Comece sua jornada conosco preenchendo os dados abaixo.</p>
    <label for="cnpj">CNPJ</label>
    <input type="text" id="cnpj" name="cnpj" placeholder="00.000.000/0000-00" maxlength="18">
    <p></p>
    <label for="razao">Nome Razão Social</label>
    <input type="text" id="razao" name="razao" autocomplete="organization">
    <p></p>
    <label for="pais">Nome do país</label>
    <input type="text" id="pais" name="pais" value="Brasil" autocomplete="country-name">
    <p></p>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" autocomplete="email">
    <div class="aceite">
    <input type="checkbox" id="privacidade" name="privacidade">
    <label for="privacidade">
        Você aceita nossos <a href="#">Termos de Serviço</a> e nossa <a href="#">Política de Privacidade</a>.
    </label>
</div>
<small class="erro" id="erro-privacidade"></small>

<button type="submit">Cadastrar</button>

<p class="login">Já possui uma conta? <a href="tela_login.html">Fazer login</a></p>


    
</body>
</html>

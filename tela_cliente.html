<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente - Nota Fiscal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/cliente.css">
</head>
<body class="pagina-cliente">
    <main class="tela">
        <h1 class="titulo">Cliente</h1>
        <p class="subtitulo">Comece sua jornada conosco preenchendo os dados abaixo.</p>
 
        <form class="form" action="./tela_opcao.html" method="get">
            <div class="campo">
                <label for="cnpj">CNPJ</label>
                <input type="text" id="cnpj" name="cnpj" inputmode="numeric" maxlength="18" placeholder="00.000.000/0000-00" required>
            </div>
 
            <div class="campo">
                <label for="razao">Nome Razão Social</label>
                <input type="text" id="razao" name="razao" placeholder="Digite a razão social" autocomplete="organization" required>
            </div>
 
            <div class="campo">
                <label for="pais">Nome do país</label>
                <input type="text" id="pais" name="pais" placeholder="Digite o país" autocomplete="country-name" required>
            </div>
 
            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Digite o e-mail" autocomplete="email" required>
            </div>
 
            <label class="check" for="termos">
                <input type="checkbox" id="termos" name="termos" required>
                <span>Você aceita nossos <a href="./">Termos de Serviço</a> e nossa <a href="./">Política de Privacidade</a>.</span>
            </label>
 
            <button type="submit" class="botao">Cadastrar</button>
        </form>
 
        <p class="rodape">Já possui uma conta? <a href="./tela_login.html">Fazer login</a></p>
    </main>
 
</body>
</html>

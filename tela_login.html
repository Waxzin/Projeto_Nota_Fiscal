<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>waxzin - fusc</title>
    <link rel="stylesheet" href="/css/Login.css">
</head>

   <main class="login">
     <section class="login__card">
       <h1 class="login__title">Bem-vindo (a)</h1>
       <p class="login__subtitle">Insira suas credenciais para acessar.</p>

       <form class="form">
         <div class="field">
           <label class="field__label" for="user">Nome de usuário ou e-mail</label>
           <div class="input input--email">
             <input class="input__control" id="user" type="text">
           </div>
         </div>

         <div class="field">
           <div class="field__row">
             <label class="field__label" for="pass">Senha</label>
             <a class="link link--small" href="#">Esqueceu a senha?</a>
           </div>
           <div class="input input--lock">
             <input class="input__control" id="pass" type="password">
           </div>
         </div>

         <label class="check">
           <input class="check__box" type="checkbox">
           <span class="check__text">Manter-me conectado neste dispositivo</span>
         </label>

         <button class="btn" type="submit">Entrar</button>
       </form>

       <p class="login__footer">
         Não tem uma conta? <a class="link" href="./tela_criar_conta.html">Cadastre-se gratuitamente</a>
       </p>
     </section>
   </main>
</html>
